[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-reengagement-platform"
version = "0.1.0"
description = "Enterprise churn prediction, A/B experiment platform and Agentic AI/RAG re-engagement system"
readme = "README.md"
# The reference/CI environment is Python 3.15 (see environment.yml), but the
# package metadata intentionally allows 3.12+ so Dependabot (which currently
# supports up to Python 3.14) and downstream tooling can resolve dependencies.
requires-python = ">=3.12,<4"
license = { text = "Proprietary" }
authors = [{ name = "Re-Engagement Platform Team" }]
dependencies = [
    # Core data processing
    # NOTE: pandas 3.x is not yet supported by mlflow 3.15.1 (mlflow imposes a
    # pandas<3 constraint). The latest pandas 2.x release (2.3.3) is used for
    # full-stack compatibility.
    "pandas>=2.3.3,<4",
    "numpy>=2.5.2",
    "pyarrow>=25.0.1",
    "duckdb>=1.5.5",
    "pyyaml>=6.0.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.9.0",
    "lightgbm>=4.7.0",
    "xgboost>=3.4.1",
    "imbalanced-learn>=0.14.0",
    "shap>=0.52.0",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
]
# CatBoost is optional: it has no Python 3.15 wheel yet, and the ensemble
# falls back to HistGradientBoostingClassifier. Install this extra on Python
# versions where CatBoost is available.
ml-catboost = ["catboost>=1.2.10"]
experiment = [
    "scipy>=1.18.0",
    "statsmodels>=0.14.6",
]
serving = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "httpx2>=2.16.0",
]
mlops = [
    "mlflow>=3.15.1",
]
monitoring = [
    "evidently>=0.7.21",
]
agents = [
    "langgraph>=1.2.11",
    "langchain>=1.3.16",
    "langchain-openai>=1.6.0",
    "langchain-anthropic>=1.6.1",
    "langchain-community>=0.4.2",
    "psycopg[binary]>=3.3.4",
    "pgvector>=0.5.0",
]
dbt = [
    # Python 3.15-compatible pins; scripts/bootstrap.sh upgrades mashumaro
    # separately because dbt-core 1.11 pins an older version that crashes.
    "dbt-core==1.11.7",
    "dbt-duckdb==1.10.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    "mypy>=1.11,<1.15",
    "types-PyYAML",
    "types-requests",
    "pre-commit>=4.6.2",
]

[project.scripts]
churn-train = "src.models.train:main"
churn-score = "src.serving.batch_score:main"
churn-api = "src.serving.api:run"
ab-analyze = "src.experiments.analysis:main"
agent-run = "src.agents.orchestrator:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py315"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom uses Depends(...) in defaults.
"src/serving/api.py" = ["B008"]

[tool.mypy]
python_version = "3.15"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::PendingDeprecationWarning:shap",
]
markers = [
    "slow: slow tests",
    "integration: tests requiring external services",
]

[tool.coverage.run]
source = ["src"]
# api.py is included so auth/PII endpoints are measured in CI.
omit = []
