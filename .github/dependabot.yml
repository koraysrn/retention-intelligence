# Dependabot policy: grouped minor/patch updates, majors reviewed manually.
version: 2

# Keep dependency noise low:
# - minor/patch updates are grouped into one PR per ecosystem,
# - major versions are ignored (reviewed manually),
# - weekly schedule, limited open PRs, automatic rebase.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    versioning-strategy: "increase"
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      python-runtime-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      python-development-minor-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    versioning-strategy: "increase"
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      frontend-runtime-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      frontend-tooling-minor-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 2
    rebase-strategy: "auto"
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
